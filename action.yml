name: OctoLab skills
description: >-
  Publishes a tool's released agent skills to the octolab/skills catalog,
  checks a catalog checkout, or reads the published record of one tool in it.
  Run publish from the tool's release workflow after the GitHub release
  exists; run check and inspect from the catalog's CI.
author: OctoLab

branding:
  icon: package
  color: purple

inputs:
  command:
    description: publish, check or inspect.
    required: false
    default: publish
  tool:
    description: publish, inspect. Tool name, e.g. indexit; publish requires it registered in catalog.json.
    required: false
  token:
    description: publish. Token with contents write access to the catalog repository.
    required: false
  source-tag:
    description: publish. Release tag of the tool, e.g. v0.2.0.
    required: false
    default: ${{ github.ref_name }}
  source-sha:
    description: publish. Commit the workflow released.
    required: false
    default: ${{ github.sha }}
  catalog-repository:
    description: publish. Catalog repository.
    required: false
    default: octolab/skills
  github-token:
    description: publish. Token that reads the tool repository; the workflow's own token by default.
    required: false
    default: ${{ github.token }}
  path:
    description: check, inspect. Catalog checkout to check or read.
    required: false
    default: .
  discovery:
    description: check. Output of `npx skills add <catalog> --skill '*' --json` to compare with the published plugins.
    required: false

outputs:
  changed:
    description: publish. Whether this run wrote a new publication.
  catalog-commit:
    description: publish. Catalog commit that holds this release.
  catalog-tag:
    description: publish. Catalog tag of this release, <tool>--v<version>.
  payload-digest:
    description: publish. Digest of the main skill's directory.
  skills-digests:
    description: publish, inspect. JSON object of every published skill's name and digest, the main skill first.
  version:
    description: inspect. Published version of the tool, X.Y.Z.
  source-repository:
    description: inspect. Repository the tool was published from, owner/repo.
  source-tag:
    description: inspect. Release tag the tool was published from, vX.Y.Z.
  source-commit:
    description: inspect. Commit the release tag pointed at.
  skills-paths:
    description: inspect. JSON object of every published skill's name and path in the tool's repository, the main skill first.

runs:
  using: node24
  main: scripts/action.mjs
